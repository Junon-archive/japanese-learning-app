# starter seed learning items (04_DB_SPEC.md Seed Data).
#
# 배열 순서가 곧 적재 순서다. loader가 이 순서대로 metadata_json.seed_order를
# 1부터 매긴다(06_LEARNING_ENGINE.md). 행을 중간에 끼워 넣으면 뒤쪽 item의
# seed_order가 전부 밀린다. 새 item은 끝에 추가하는 것을 원칙으로 한다.
#
# frequency_rank는 "작을수록 고빈도"인 언어 빈도 정보다. 지금 값은 일상
# 회화에서의 대략적 체감 순위이며 코퍼스 기반이 아니다(코퍼스 frequency는
# MVP 범위 밖). seed_order로 대체하지 않는다.

