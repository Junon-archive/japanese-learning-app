- seed_id: sn_0009
  japanese: 電車に傘を忘れてしまった。
  korean_translation: 전철에 우산을 두고 내려 버렸다.
  items:
    - item_seed_id: it_wasureru
      surface_form: 忘れ
      is_tappable: true
      spans:
        - {start_codepoint: 5, end_codepoint: 7, span_order: 0}
      explanation:
        reading: わすれ
        core_meaning: 잊다; (물건을) 두고 오다
        meaning_in_context: 우산을 전철 안에 두고 내렸다는 뜻이다.
        nuance: 기억을 잊는 것 외에 물건을 "두고 오다"에도 쓴다. 이때는 한국어 "잊어버리다"보다 "두고 오다"가 자연스럽다.
        example_sentence: 家に財布を忘れてきた。
        example_translation: 집에 지갑을 두고 왔다.

    - item_seed_id: it_teshimau
      surface_form: てしまった
      is_tappable: true
      spans:
        - {start_codepoint: 7, end_codepoint: 12, span_order: 0}
      explanation:
        reading: てしまった
