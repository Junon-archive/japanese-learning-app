        meaning_in_context: 두고 내린 일을 되돌릴 수 없어 아쉬워하는 마음을 더한다.
        nuance: 「〜てしまう」는 완료에 "의도치 않게, 아쉽게도"라는 감정을 얹는다. 회화에서는 「〜ちゃう」로 줄여 말한다.
        example_sentence: 大事なメールを消してしまった。
        example_translation: 중요한 메일을 지워 버렸다.

- seed_id: sn_0010
  japanese: すみません、電車が遅れているので少し遅くなります。
  korean_translation: 죄송해요, 전철이 늦어지고 있어서 조금 늦을 것 같아요.
  items:
    - item_seed_id: it_sumimasen
      surface_form: すみません
      is_tappable: true
      spans:
        - {start_codepoint: 0, end_codepoint: 5, span_order: 0}
      explanation:
        reading: すみません
        core_meaning: 죄송합니다; 저기요; 고맙습니다
        meaning_in_context: 약속 시간에 늦는 것을 미리 사과한다.
        nuance: 일상적인 사과의 기본형이다. 업무에서 정식으로 사과할 때는 「申し訳ありません」이 더 무겁다.
        example_sentence: 返事が遅くなって、すみません。
        example_translation: 답장이 늦어서 죄송해요.

    - item_seed_id: it_okureru
      surface_form: 遅れ
      is_tappable: true
      spans:
        - {start_codepoint: 9, end_codepoint: 11, span_order: 0}
      explanation:
        reading: おくれ
        core_meaning: 늦다, 지연되다
        meaning_in_context: 전철이 정해진 시각보다 늦게 운행되고 있다는 뜻이다.
        nuance: 교통수단의 지연에 「遅れる」를 쓴다. 사람이 늦을 때도 쓰며 「遅刻する」(지각하다)보다 부드럽다.
        example_sentence: 事故で飛行機が一時間遅れた。
        example_translation: 사고로 비행기가 한 시간 늦어졌다.

- seed_id: sn_0011
