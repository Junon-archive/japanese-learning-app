# starter seed sentences.
#
# start_codepoint / end_codepoint는 `japanese`의 Unicode code point index이며 반열린 구간
# [start, end)다. loader가 문장 문자열과 다시 대조한다.
#
# 문장 순서 = sentences.id 순서. exploration과 anchor 지정은 아직 안 본 문장 중 id가 작은 것을
# 고르므로, 기존 문장 순서를 바꾸지 않고 새 문장은 끝에 붙인다.
# 모든 tappable item은 explanation을 가진다. 한 문장의 target은 1~2개다.

# ---- seed/ 원본

# 이 문장에는 it_shigoto sentence_item을 두지 않는다. 문장당 target은 1~2개다
# (08_LLM_SPEC.md의 Deterministic Content Validation 5번).
- seed_id: sn_0001
  japanese: この仕事、田中さんに任せてもいい？
  korean_translation: 이 일, 다나카 씨에게 맡겨도 될까?
  items:
    - item_seed_id: it_makaseru
      surface_form: 任せ
      is_tappable: true
      spans:
        - {start_codepoint: 10, end_codepoint: 12, span_order: 0}
      explanation:
        reading: まかせ
        core_meaning: 맡기다
        meaning_in_context: 이 업무의 처리를 다나카 씨에게 넘긴다는 뜻이다.
        nuance: 「任せる」는 판단까지 상대에게 넘기는 쪽이고, 「頼む」는 부탁에 가깝다.
        example_sentence: あとは私に任せてください。
        example_translation: 나머지는 저에게 맡겨 주세요.

    - item_seed_id: it_temoii
      surface_form: てもいい
      is_tappable: true
      spans:
        - {start_codepoint: 12, end_codepoint: 16, span_order: 0}
      explanation:
        reading: てもいい
        core_meaning: ~해도 된다 (허가)
        meaning_in_context: 상승 억양의 의문형이라 "그렇게 해도 괜찮겠냐"고 상대의 허락을 구한다.
        nuance: 평서문이면 허가를 주는 쪽, 의문문이면 허가를 구하는 쪽이 된다.
        example_sentence: ここに座ってもいいですか。
        example_translation: 여기 앉아도 될까요?

- seed_id: sn_0002
  japanese: ちょっと手伝ってもらえますか？
  korean_translation: 좀 도와주실 수 있나요?
  items:
    - item_seed_id: it_chotto
      surface_form: ちょっと
      is_tappable: true
      spans:
        - {start_codepoint: 0, end_codepoint: 4, span_order: 0}
      explanation:
        reading: ちょっと
        core_meaning: 조금, 좀
        meaning_in_context: 부탁의 부담을 낮추는 완충어로, 실제 분량이 적다는 뜻은 아니다.
        nuance: 한국어 "좀 도와줄래?"의 "좀"과 거의 같은 자리에 쓰인다.
        example_sentence: ちょっと待ってください。
        example_translation: 잠깐만 기다려 주세요.

    - item_seed_id: it_tetsudau
      surface_form: 手伝って
      is_tappable: true
      spans:
        - {start_codepoint: 4, end_codepoint: 8, span_order: 0}
      explanation:
        reading: てつだって
        core_meaning: 돕다, 거들다
        meaning_in_context: 화자가 하고 있는 일을 옆에서 거들어 달라는 요청이다.
        nuance: 「助ける」가 위기에서 구한다는 뜻이라면 「手伝う」는 일손을 보탠다는 뜻이다.
        example_sentence: 引っ越しを手伝ってくれてありがとう。
        example_translation: 이사를 도와줘서 고마워.

- seed_id: sn_0003
  japanese: お疲れ様でした。あとは私に任せてください。
  korean_translation: 수고하셨습니다. 나머지는 저에게 맡겨 주세요.
  items:
    - item_seed_id: it_otsukaresama
      surface_form: お疲れ様でした
      is_tappable: true
      spans:
        - {start_codepoint: 0, end_codepoint: 7, span_order: 0}
      explanation:
        reading: おつかれさまでした
        core_meaning: 수고하셨습니다
        meaning_in_context: 일을 끝낸 상대에게 건네는 정중한 인사다.
        nuance: 「ご苦労様」는 윗사람이 아랫사람에게 쓰므로 상사에게는 쓰지 않는다.
        example_sentence: 今日もお疲れ様でした。
        example_translation: 오늘도 수고하셨습니다.

    - item_seed_id: it_makaseru
      surface_form: 任せて
      is_tappable: true
      spans:
        - {start_codepoint: 13, end_codepoint: 16, span_order: 0}
      explanation:
        reading: まかせて
        core_meaning: 맡기다
        meaning_in_context: 남은 일을 화자가 떠맡겠다고 나서는 표현이다.
        nuance: 「任せてください」는 자신감을, 「お願いします」는 부탁을 나타낸다.
        example_sentence: この件は任せておいてください。
        example_translation: 이 건은 맡겨 두세요.

# 불연속 span 예시. 「気が乗る」가 「気が全然乗らない」로 갈라진다.
- seed_id: sn_0004
  japanese: 今日はなぜか気が全然乗らない。
  korean_translation: 오늘은 왠지 전혀 마음이 내키지 않는다.
  items:
    - item_seed_id: it_kiganoru
      surface_form: 気が乗ら
      is_tappable: true
      spans:
        - {start_codepoint: 6, end_codepoint: 8, span_order: 0}
        - {start_codepoint: 10, end_codepoint: 12, span_order: 1}
      explanation:
        reading: きがのら
        core_meaning: 마음이 내키다
        meaning_in_context: 「全然」이 사이에 끼어들어 "전혀 내키지 않는다"가 된다.
        nuance: 능력이나 상황이 아니라 기분의 문제를 말한다. 부정형으로 쓰이는 일이 많다.
        example_sentence: 今日は勉強に気が乗らない。
        example_translation: 오늘은 공부에 마음이 내키지 않는다.

# ---- 샘플

- seed_id: sn_0005
  japanese: 大丈夫？顔色があまりよくないよ。
  korean_translation: 괜찮아? 안색이 별로 안 좋아.
  items:
    - item_seed_id: it_daijoubu
      surface_form: 大丈夫
      is_tappable: true
      spans:
        - {start_codepoint: 0, end_codepoint: 3, span_order: 0}
      explanation:
        reading: だいじょうぶ
        core_meaning: 괜찮다, 문제없다
        meaning_in_context: 상대의 몸 상태를 걱정하며 괜찮은지 묻는다.
        nuance: 끝을 올려 묻는 「大丈夫？」는 걱정과 확인이고, 대답하는 「大丈夫です」는 "문제없다"는 뜻이다.
        example_sentence: 怪我は大丈夫ですか。
        example_translation: 다친 데는 괜찮으세요?

- seed_id: sn_0006
  japanese: すみません、この席は空いていますか。
  korean_translation: 저기요, 이 자리 비어 있나요?
  items:
    - item_seed_id: it_sumimasen
      surface_form: すみません
      is_tappable: true
      spans:
        - {start_codepoint: 0, end_codepoint: 5, span_order: 0}
      explanation:
        reading: すみません
        core_meaning: 죄송합니다; 저기요; 고맙습니다
        meaning_in_context: 모르는 사람에게 말을 걸기 전에 "저기요, 실례합니다"로 쓰였다.
        nuance: 사과, 부르기, 감사를 모두 나타낸다. 「ごめんなさい」는 사과에만 쓰고 주로 가까운 사이에서 쓴다.
        example_sentence: すみません、お水をください。
        example_translation: 저기요, 물 좀 주세요.

- seed_id: sn_0007
  japanese: 今週は忙しいから、来週にしない？
  korean_translation: 이번 주는 바쁘니까 다음 주로 하지 않을래?
  items:
    - item_seed_id: it_isogashii
      surface_form: 忙しい
      is_tappable: true
      spans:
        - {start_codepoint: 3, end_codepoint: 6, span_order: 0}
      explanation:
        reading: いそがしい
        core_meaning: 바쁘다
        meaning_in_context: 이번 주에는 일정이 꽉 차서 약속을 미루자는 이유로 쓰였다.
        nuance: 약속을 미루거나 거절할 때 이유로 자주 댄다. 반대말은 「暇」(한가하다)다.
        example_sentence: 最近、忙しくて寝る時間がない。
        example_translation: 요즘 바빠서 잘 시간이 없다.

- seed_id: sn_0008
