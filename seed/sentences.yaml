        nuance: 정해진 시각이나 마감에 늦지 않고 대는 것이다. 딱 맞는 한국어 한 단어가 없어 "시간에 맞추다, 탈 수 있다" 등으로 옮긴다.
        example_sentence: 締め切りに間に合った。
        example_translation: 마감에 맞췄다.

- seed_id: sn_0012
  japanese: 旅行の日にち、そろそろ決めない？
  korean_translation: 여행 날짜, 슬슬 정하지 않을래?
  items:
    - item_seed_id: it_sorosoro
      surface_form: そろそろ
      is_tappable: true
      spans:
        - {start_codepoint: 7, end_codepoint: 11, span_order: 0}
      explanation:
        reading: そろそろ
        core_meaning: 슬슬, 이제 곧
        meaning_in_context: 이제 날짜를 정할 때가 됐다는 느낌을 준다.
        nuance: 때가 무르익었음을 부드럽게 알린다. 재촉하는 말도 「そろそろ」를 붙이면 완곡해진다.
        example_sentence: そろそろ始めましょうか。
        example_translation: 슬슬 시작할까요?

    - item_seed_id: it_kimeru
      surface_form: 決め
      is_tappable: true
      spans:
        - {start_codepoint: 11, end_codepoint: 13, span_order: 0}
      explanation:
        reading: きめ
        core_meaning: 정하다, 결정하다
        meaning_in_context: 여행 날짜를 확정하자는 제안이다.
        nuance: 「決めない？」 같은 부정 의문은 "~하지 않을래?"라는 권유다. 「決める」는 "정하다", 「決まる」는 "정해지다"다.
        example_sentence: 集合時間を決めよう。
        example_translation: 모일 시간을 정하자.

