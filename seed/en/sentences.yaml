# MVP-03 영어 1차 seed sentences (876개, item당 3~4개 x 300개 대략).
#
# start_codepoint / end_codepoint는 `text`의 Unicode code point index이며 반열린 구간
# [start, end)다. loader가 문장 문자열과 다시 대조한다. 영어라 ruby_json은 없다(DB CHECK가
# NULL을 강제한다). explanation.reading도 없다(영어는 발음 표기를 하지 않는다).
#
# 문장 순서 = sentences.id 순서. 새 문장은 끝에 붙인다(증분 적재, 04_DB_SPEC.md).
# 모든 tappable item은 explanation을 가진다. 이번 1차는 문장당 target을 1개로만 썼다.
#
# 예문은 PHRASE List/PHaVE List의 원문을 베끼지 않고 새로 쓴 것이다(불변식 27, ADR-024
# 결정 1). 원본은 scripts/select_english_candidates.py가 참고만 하고 저장소에 없다.

