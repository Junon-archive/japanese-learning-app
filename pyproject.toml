[project]
name = "nihongo-context"
version = "0.1.0"
description = "Nihongo Context — contextual Japanese learning backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "argon2-cffi",
    "fastapi",
    "fsrs==6.3.2",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "openai>=3.13.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "mypy",
    "types-PyYAML",
    # 로컬/테스트 전용 PostgreSQL 16 (ADR-002). app 코드에서 import 금지.
    "pgserver",
    # 브라우저 E2E (backend/tests/e2e). 브라우저 바이너리는 내려받지 않는다 ---
    # `channel="chrome"`으로 **시스템에 설치된 Chrome**을 쓴다. 그래서 이 의존성이
    # 있어도 `playwright install`은 필요 없고, Chrome이 없는 머신에서는
    # `make test-e2e`가 실패한다(skip이 아니다).
    "playwright>=1.62.0",
]
# 후리가나 형태소 분석기와 사전 (ADR-021 결정 6). worker 이미지와 호스트 CLI에만 있다.
# API 이미지는 `--no-default-groups`로 sync해 이 group을 받지 않는다. main dependencies로
# 옮기면 Dockerfile 명령과 무관하게 API 이미지에 들어간다(test_infra_compose.py가 막는다).
furigana = [
    "sudachipy==0.6.11",
    "sudachidict-core==20260723",
]

[tool.uv]
# 호스트 `uv sync` / `uv run`은 dev + furigana 전부. `--no-dev`로는 furigana가 빠지지 않으므로
# 두 Dockerfile은 `--no-default-groups`를 쓴다.
default-groups = ["dev", "furigana"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "ANN",
    "S",
    "T20",
    "DTZ",
    "RUF",
    "PTH",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 assert를 쓰고 리터럴 credential을 다룬다(S101/S105/S106).
"backend/tests/**" = ["S101", "S105", "S106", "ANN201", "ANN001"]

[tool.mypy]
strict = true
files = ["backend", "scripts"]
mypy_path = ["backend"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
# 기본 실행에서 `e2e`를 뺀다. e2e는 frontend 빌드 산출물과 Chrome을 요구하므로
# `make test`가 그것들의 존재에 의존하면 안 된다. 진입점은 `make test-e2e` 하나다.
# 명령줄의 `-m`이 이 값을 덮어쓴다(addopts가 앞에 붙는다).
addopts = "-q --strict-markers --strict-config -m \"not e2e\""
markers = [
    "integration: requires a running PostgreSQL",
    # 실제 브라우저(Chrome)로 도는 테스트. `-m e2e`로만 수집된다.
    "e2e: drives a real browser against the in-process app",
]
filterwarnings = [
    "error",
    # starlette 1.6이 import 시점에 띄우는 서드파티 alias 경고. 우리 코드로는 못 고친다.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
